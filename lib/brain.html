<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord brain · 3D</title>
<!-- maw atlas brain: Discord servers in 3D. One point per conversation chunk (one room or thread, cut on 3 h of
     silence), placed by meaning (EmbeddingGemma via Chippy -> UMAP 3D, scripts/atlas-brain.py), coloured by room /
     month / source / server, lines to the 4 nearest in meaning. Local only: lib/brain-server.ts on 127.0.0.1.
     Ported from laris-co/facebook-oracle brain/index.html (itself from laris-co/book-library's brain). -->
<style>
:root{--bg:#07080c;--fg:#e8e6df;--dim:#8a8a93;--panel:rgba(16,18,26,.88);--line:rgba(255,255,255,.08);--accent:#7cc4ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,system-ui,"Noto Sans Thai",sans-serif;overflow:hidden}
canvas{display:block}
/* seamless scrollbars: thin, dark, no white track */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
::-webkit-scrollbar-corner{background:transparent}
.bar{position:fixed;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;flex-wrap:nowrap;pointer-events:none}
.bar>*{pointer-events:auto}
.brand{font-weight:650;letter-spacing:.02em;display:flex;gap:8px;align-items:center}
.brand{flex:0 1 auto;min-width:0;white-space:nowrap}.brand small{color:var(--dim);font-weight:400;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.brand small{display:none}}
.btn.on{border-color:rgba(124,196,255,.55);color:var(--accent)}
a.brand{color:var(--fg);text-decoration:none;cursor:pointer}a.brand:hover{color:var(--accent)}
.story-btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.story a{display:grid;grid-template-columns:92px 1fr;gap:8px;color:var(--fg);text-decoration:none;font-size:12.5px;padding:5px 0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.story a:hover{color:var(--accent)}.story a.cur{color:var(--accent)}.story a time{color:var(--dim);font-variant-numeric:tabular-nums}.story a small{color:var(--dim);display:block}
.search{display:flex;align-items:center;gap:6px;flex:0 1 340px;min-width:140px;height:36px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-left:auto;backdrop-filter:blur(8px)}
.search input{background:none;border:0;outline:0;color:var(--fg);width:100%;min-width:0;font:inherit;text-overflow:ellipsis}
.btn{flex:none;white-space:nowrap;height:36px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 9px;cursor:pointer;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px);font:inherit}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn:disabled{cursor:default;opacity:.4}.btn:disabled:hover{border-color:var(--line)}
canvas.on-point{cursor:pointer}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.legend{position:fixed;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:52vh;overflow:auto;backdrop-filter:blur(8px);width:270px}
.legend h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.legend .modes{display:flex;gap:4px;margin-bottom:8px}
.legend .modes button{flex:1;background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:3px 0;cursor:pointer;font:12px inherit}
.legend .modes button.on{color:var(--fg);border-color:rgba(255,255,255,.3)}
.fam{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0;font-size:13px;user-select:none}
.fam.off{opacity:.3}.fam i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.fam .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fam span.n{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.panel{position:fixed;right:14px;top:var(--top,64px);bottom:14px;width:min(440px,42vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:auto;backdrop-filter:blur(10px);transform:translateX(calc(100% + 20px));transition:transform .25s ease}
.panel.open{transform:none}
.panel h3{margin:0 0 4px;font-size:16px}.panel .meta{color:var(--dim);font-size:12px;margin-bottom:10px}
.panel .nav{display:flex;gap:6px;margin-bottom:10px}
.msg{font-size:13.5px;line-height:1.6;margin:0 0 6px;white-space:pre-wrap;word-break:break-word}
.msg b{font-weight:600;color:#c9c6bc}.msg.own b{color:var(--accent)}.msg time{color:var(--dim);font-size:11px;margin-right:6px;font-variant-numeric:tabular-nums}
.hits{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.hits a{display:block;color:var(--fg);text-decoration:none;font-size:12.5px;padding:4px 0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.hits a:hover{color:var(--accent)}.hits a small{color:var(--dim);display:block}
.tip{position:fixed;pointer-events:none;background:rgba(0,0,0,.82);border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:12px;display:none;max-width:340px}
.status{position:fixed;right:14px;bottom:14px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}
.seg{display:flex;flex:none;height:36px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;backdrop-filter:blur(8px)}
.seg button{background:none;border:0;color:var(--dim);border-radius:7px;padding:0 9px;cursor:pointer;font:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--fg)}.seg button.on{background:rgba(124,196,255,.14);color:var(--accent)}
@media (max-width:1250px){.seg button span{display:none}}
.isl{position:fixed;left:0;top:0;pointer-events:none;font-size:12px;color:var(--fg);text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .4s}
.isl small{color:var(--dim)}body.sep .isl{opacity:.92}
.panel.open~.status{right:calc(min(440px,42vw) + 28px)}
/* time machine: a date column on the right edge, oldest at the top, now at the bottom (like macOS Time Machine) */
.tm{position:fixed;right:14px;top:var(--top,64px);bottom:44px;width:118px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;transition:right .25s ease;user-select:none}
.panel.open~.tm{right:calc(min(440px,42vw) + 28px)}
.tm button{width:28px;height:24px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tm button:hover:not(:disabled){border-color:rgba(255,255,255,.3)}.tm button.held{border-color:#ff4d4d;color:#ff6b6b;transform:scale(.94)}
.tm button{transition:transform .1s,border-color .1s}.tm button:disabled{opacity:.35;cursor:default}
.tm-track{position:relative;flex:1;width:100%;cursor:pointer;touch-action:none}
.tm-track::before{content:"";position:absolute;right:-6px;top:-4px;bottom:-4px;width:46px;border-radius:10px;background:rgba(255,255,255,0);transition:background .2s}
.tm-track:hover::before,.tm-track.drag::before{background:rgba(255,255,255,.045)}
.tm-sel{position:absolute;right:0;left:0;height:0;pointer-events:none;transition:opacity .4s;opacity:0}
.tm-sel.on{opacity:1}.tm-sel::after{content:"";position:absolute;right:0;width:34px;height:3px;border-radius:2px;background:#ff4d4d;transform:translateY(-50%);box-shadow:0 0 10px #ff4d4d}
.tm-sel span{position:absolute;right:40px;transform:translateY(-50%);font:600 11.5px/1 -apple-system,system-ui,sans-serif;color:#ff6b6b;white-space:nowrap;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:5px}
.tm-track i{position:absolute;right:0;height:1px;background:rgba(255,255,255,.32);transform:translateY(-50%);transition:width .14s ease-out,background .14s}
.tm-track i.past{background:rgba(255,255,255,.55)}.tm-track i.hov{background:var(--accent);height:2px}.tm-track i.sel{background:#ff4d4d;height:2px}
.tm-track b{position:absolute;right:26px;font:500 10.5px/1 -apple-system,system-ui,sans-serif;color:var(--dim);transform:translateY(-50%);white-space:nowrap;pointer-events:none}
.tm-track b.sel{color:#ff6b6b}.tm-track b.hov{color:var(--accent);font-size:12px;background:rgba(0,0,0,.75);padding:3px 6px;border-radius:5px;z-index:2}
.tm-now{font:600 11px/1 -apple-system,system-ui,sans-serif;color:#ff4d4d;cursor:pointer;padding:2px 0}.tm-now.off{color:var(--dim)}
.tm-cap{font-size:10.5px;color:var(--dim);text-align:right}
.tm-big{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.97);text-align:center;pointer-events:none;opacity:0;transition:opacity .5s ease,transform .5s ease}
.tm-big.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.zap{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(190,220,255,.32),rgba(120,160,255,.08) 45%,rgba(0,0,0,0) 75%);opacity:0;z-index:5}
.tm-big b{display:block;font:200 68px/1.05 -apple-system,system-ui,sans-serif;letter-spacing:.03em;color:#fff;text-shadow:0 0 28px rgba(0,0,0,.95);font-variant-numeric:tabular-nums}
.tm-big small{display:block;margin-top:8px;font-size:14px;color:#c9c6bc;text-shadow:0 0 10px #000;font-variant-numeric:tabular-nums}
</style>

<body>
<div class="bar">
  <a class="brand" id="home" href="./" title="กลับหน้าหลัก (ล้างทุกอย่าง)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M12 5v13"/></svg>Discord brain <small id="count"></small></a>
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="ค้นความหมาย… แล้วกด Enter"></label>
  <div class="seg" id="layoutSeg" title="Combined: every room in one meaning space (where rooms agree) · Separate: each room its own island"><button data-layout="all" class="on"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg><span>Combined</span></button><button data-layout="rooms"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="3"/><circle cx="12" cy="12" r="3"/><circle cx="19" cy="12" r="3"/></svg><span>Separate</span></button></div>
  <button class="btn" id="links" title="เส้นเชื่อม: เปิด / ปิด"><svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></svg><span id="linksLabel">links: on</span></button>
  <button class="btn on" id="spin" title="หมุนอัตโนมัติ: กำลังหมุน (กดเพื่อหยุด)"><svg class="i" viewBox="0 0 24 24" id="spinIcon"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <button class="btn" id="reset" title="ล้างการเลือก (ค้นหา / story / จุดที่เปิด)"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
</div>
<div class="legend"><div class="modes"><button data-m="topic" id="topicBtn">topic</button><button data-m="room" class="on">room</button><button data-m="month">month</button><button data-m="source">source</button><button data-m="server" id="srvBtn">server</button></div><h4 id="legendTitle">Rooms</h4><div id="fams"></div></div>
<aside class="panel" id="panel"></aside>
<div class="tm" id="tm" title="Time Machine: click a day to see the map as it was that day"><div class="tm-cap">time machine</div><button id="tmUp" title="earlier day (hold to keep going back)">▲</button><div class="tm-track" id="tmTrack"><div id="tmTicks"></div><div class="tm-sel" id="tmSel"><span></span></div></div><button id="tmDown" title="later day (hold to replay forward)">▼</button><div class="tm-now" id="tmNow" title="back to now">Now</div></div>
<div class="tip" id="tip"></div>
<div class="zap" id="zap"></div>
<div class="tm-big" id="tmBig"><b id="tmBigDay"></b><small id="tmBigN"></small></div>
<div id="isls"></div>
<div class="status" id="status">loading…</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bin = (f, T) => fetch(`/brain/data/${f}`).then((r) => (r.ok ? r.arrayBuffer() : new ArrayBuffer(0))).then((b) => new T(b));
const [meta, xyz, grp, src, mon, gld, knn] = await Promise.all([
  fetch("/brain/data/meta.json").then((r) => r.json()),
  bin("xyz.f32", Float32Array), bin("grp.u32", Uint32Array), bin("src.u8", Uint8Array), bin("mon.u16", Uint16Array), bin("gld.u8", Uint8Array), bin("knn.u32", Uint32Array),
]);
const servers = meta.servers || [];
// the Separate layout (scripts/atlas-brain.py separate → sep.f32 + sep.json): one island per room; optional
const sepInfo = await fetch("/brain/data/sep.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
const sepRaw = sepInfo ? await bin("sep.f32", Float32Array) : new Float32Array(0);
const insight = await fetch("/brain/data/insight.json").then((r) => (r.ok ? r.json() : null));
const topic = await bin("topic.u16", Uint16Array);
if (!insight || topic.length !== meta.n) document.getElementById("topicBtn").remove();
if (servers.length < 2) document.getElementById("srvBtn").remove();
const monLabel = (m) => `${2000 + Math.floor(m / 12)}-${String((m % 12) + 1).padStart(2, "0")}`;
const roomTitle = (gi) => (servers.length > 1 ? `${servers[groups[gi].server]?.name} › ` : "") + groups[gi].title;
const N = meta.n, groups = meta.groups, K = meta.k || 0;
// robust scale: a few far outliers set the build's +-100 box, so rescale so that 98% of points sit inside radius 100
const robust = (a) => { const r = new Float32Array(N); for (let i = 0; i < N; i++) r[i] = Math.hypot(a[i * 3], a[i * 3 + 1], a[i * 3 + 2]);
  const p98 = Float32Array.from(r).sort()[Math.floor(N * 0.98)] || 100; const f = 100 / p98; for (let i = 0; i < N * 3; i++) a[i] *= f; return f; };
window.__scale = robust(xyz);
// LAYOUTS: the point positions of each layout. xyz becomes the live buffer the GPU draws (a copy of the current
// layout, or a blend of two while the points glide); every lookup of "where is point i" goes through it.
const LAYOUTS = { all: Float32Array.from(xyz) };
if (sepInfo && sepRaw.length === N * 3) { const f = robust(sepRaw); LAYOUTS.rooms = sepRaw; sepInfo.islands.forEach((isl) => { isl.c = isl.c.map((v) => v * f); isl.r *= f; }); }
else $("layoutSeg").remove();
$("count").textContent = `${N.toLocaleString()} chunks · ${meta.counts.messages.toLocaleString()} messages · ${meta.counts.rooms} rooms${servers.length > 1 ? ` · ${servers.length} servers` : ""}`;
const day = (ms) => new Date(ms).toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
// ---- time: t0.u32 = each chunk's start (unix seconds; older brains: `maw atlas brain insight` writes it, else the
// month from mon.u16). Days are Bangkok days (UTC+7, no DST): dayIdx = days since 1970-01-01 there.
const t0raw = await bin("t0.u32", Uint32Array);
const t0 = t0raw.length === N ? t0raw : Uint32Array.from(mon, (m) => Date.UTC(2000 + Math.floor(m / 12), m % 12, 1) / 1000);
const dayIdx = Uint32Array.from(t0, (t) => Math.floor((t + 7 * 3600) / 86400));
const dayLabel = (d) => new Date(d * 86400000).toISOString().slice(0, 10);
const dayCount = new Map(); for (let i = 0; i < N; i++) dayCount.set(dayIdx[i], (dayCount.get(dayIdx[i]) || 0) + 1);
const DAYS = [...dayCount.keys()].sort((a, b) => a - b);
const dayOf = (label) => { const d = Math.floor(Date.parse(label + "T00:00:00Z") / 86400000); return dayCount.has(d) ? d : null; };
let tDay = null;   // the day the map is shown "as of" (null = now)
const inTime = (i) => tDay === null || dayIdx[i] <= tDay;
const hm = (ms) => new Date(ms).toLocaleTimeString("en-GB", { timeZone: "Asia/Bangkok", hour: "2-digit", minute: "2-digit" });

// ---- colour modes: room (largest 18, the rest one quiet colour), month, source (people / bots / both), server
const SRC = [["people", 0x5fb3ff], ["bots", 0xff6b9a], ["people + bots", 0xffb454]];
const OTHER = new THREE.Color(0x4a5470);
const hue = (k, n) => new THREE.Color().setHSL(0.66 - 0.66 * (k / Math.max(1, n - 1)), 0.7, 0.6);
function buildMode(mode) {
  if (mode === "source") {
    const n = [0, 0, 0]; for (let i = 0; i < N; i++) n[src[i]]++;
    return { title: "Who wrote it", keyOf: (i) => src[i], entries: SRC.map(([l, c], k) => ({ key: k, label: l, n: n[k], color: new THREE.Color(c) })).filter((e) => e.n) };
  }
  if (mode === "topic") {
    const T = insight.topics;
    const rest = topic.reduce((s, t) => s + (t === 65535 ? 1 : 0), 0);
    const entries = T.map((t, k) => ({ key: t.id, label: `${t.id} · ${t.keywords.slice(0, 4).join(", ")}`, n: t.chunks, color: new THREE.Color().setHSL((k * 0.618 + 0.08) % 1, 0.7, 0.6) }));
    if (rest) entries.push({ key: 65535, label: "no topic", n: rest, color: OTHER });
    return { title: `Topics (${T.length}) · c-TF-IDF keywords`, keyOf: (i) => topic[i], entries };
  }
  if (mode === "server") {
    const n = servers.map(() => 0); for (let i = 0; i < N; i++) n[gld[i]]++;
    return { title: "Server", keyOf: (i) => gld[i], entries: servers.map((sv, k) => ({ key: k, label: sv.name, n: n[k], color: new THREE.Color().setHSL((k * 0.618 + 0.08) % 1, 0.7, 0.6) })) };
  }
  if (mode === "month") {
    const n = new Map(); for (let i = 0; i < N; i++) n.set(mon[i], (n.get(mon[i]) || 0) + 1);
    const ms = [...n.keys()].sort((a, b) => a - b);
    return { title: "Month", keyOf: (i) => mon[i], entries: ms.map((m, k) => ({ key: m, label: monLabel(m), n: n.get(m), color: hue(k, ms.length) })).reverse() };
  }
  const order = groups.map((g, i) => i).sort((a, b) => groups[b].points - groups[a].points);
  const top = new Set(order.slice(0, 18));
  const entries = []; let h = 0;
  for (const i of order) if (top.has(i)) entries.push({ key: i, label: roomTitle(i), n: groups[i].points, color: new THREE.Color().setHSL((h++ * 0.618 + 0.08) % 1, 0.65, 0.62) });
  const rest = N - entries.reduce((s, e) => s + e.n, 0);
  if (rest) entries.push({ key: -1, label: `other rooms (${(groups.length - entries.length).toLocaleString()})`, n: rest, color: OTHER });
  return { title: groups.length > 18 ? "Rooms (largest 18)" : "Rooms", keyOf: (i) => (top.has(grp[i]) ? grp[i] : -1), entries };
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07080c, 0.0032);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 25, 150);   // close enough that the main cloud fills the view
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
// left-drag rotation is ours (below): it turns the scene around the point under the mouse, not the screen centre.
// OrbitControls keeps right-drag pan and wheel zoom — zooming toward the cursor.
controls.enableRotate = false; controls.zoomToCursor = true; controls.screenSpacePanning = true;

const sprite = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.35, "rgba(255,255,255,.55)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(xyz, 3));
const base = new Float32Array(N * 3), col = new Float32Array(N * 3);
geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: N > 20000 ? 0.75 : N > 5000 ? 1.2 : 1.8, map: sprite, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true }));

      <div class="story-btns"><button class="btn" data-story="q">📖 story of these hits, in time order</button></div>${rows.map(({ h, s0, t }) =>
      `<a data-i="${h.i}">${esc(t)}<small>${esc(roomTitle(grp[h.i]))} · ${day(s0)} · cos ${h.score}</small></a>`).join("")}</div>`;
    status = `${hits.length} meaning hits + ${kw.length} keyword · vector: ${out.vector_from} · ${out.ms} ms`;
  }
  if (st.story) {
    const sd = await story(st.story, st.q); if (seq !== renderSeq) return;
    if (sd) {
      storyIds = sd.ids;
      const rows = await Promise.all(sd.ids.slice(0, 400).map(async (i) => { const [s0, , th, ls] = await point(i); return { i, s0, th, t: snip(ls, 90) }; }));
      storyBlock = `<div class="hits story"><div class="meta">📖 story · ${esc(sd.title)} · ${sd.ids.length} chunks · ${sd.first} → ${sd.last} · oldest first (the line on the map: blue = old, red = new)</div>${rows.map(({ i, s0, th, t }) =>
        `<a data-i="${i}" class="${i === st.p ? "cur" : ""}"><time>${day(s0)}<br>${hm(s0)}</time><span>${esc(t)}<small>${esc(roomTitle(grp[i]))}${th ? " › " + esc(th) : ""}</small></span></a>`).join("")}
        ${sd.ids.length > 400 ? `<div class="meta">… ${sd.ids.length - 400} more — the whole story as text: <a href="/brain/api/story?${st.story.startsWith("q") ? "q=" + encodeURIComponent(st.q) : st.story.replace(":", "=")}" target="_blank">/brain/api/story</a></div>` : ""}</div>`;
      status = `story: ${sd.ids.length} chunks ${sd.first} → ${sd.last}`;
    }
  }
  // time travel changes the map only (no side panel): that day lit, later chunks gone, counts in the status line
  if (tDay !== null && !st.q && !st.story) {
    let shown = 0, that = 0; for (let i = 0; i < N; i++) if (dayIdx[i] <= tDay) { shown++; if (dayIdx[i] === tDay) that++; }
    status = `time machine · ${st.t} · ${shown.toLocaleString()} of ${N.toLocaleString()} chunks existed · ${that} that day · drag the column to scrub · hold ▲ ▼ to replay · ↑ ↓ step · Esc = Now`;
  }
  drawStory(storyIds);
  // focus: story > search > the open point's room > nothing
  if (storyIds) { focus = new Set(storyIds); focusStrong = new Set(st.p >= 0 ? [st.p] : []); }
  else if (st.q) { focus = new Set([...hits.map((h) => h.i), ...kw]); focusStrong = new Set(st.p >= 0 ? [st.p] : hits.slice(0, 15).map((h) => h.i)); }
  else if (st.p >= 0) { focus = new Set(); for (let j = 0; j < N; j++) if (grp[j] === grp[st.p]) focus.add(j); focusStrong = new Set([st.p]); }
  else { focus = focusStrong = null; }
  paint();
  const panel = $("panel");
  if (st.p >= 0) {
    const i = st.p, g = groups[grp[i]];
    flyTo(i);
    const [start, end, thread, lines] = await point(i); if (seq !== renderSeq) return;
    let prev = -1, next = -1;
    if (storyIds) { const k = storyIds.indexOf(i); if (k > 0) prev = storyIds[k - 1]; if (k >= 0 && k + 1 < storyIds.length) next = storyIds[k + 1]; }
    else { prev = i > 0 && grp[i - 1] === grp[i] ? i - 1 : -1; next = i + 1 < N && grp[i + 1] === grp[i] ? i + 1 : -1; }
    const tp = insight && topic[i] !== 65535 ? insight.topics[topic[i]] : null;
    panel.innerHTML = `<h3>${esc(roomTitle(grp[i]))}${thread ? ` <small>› 🧵 ${esc(thread)}</small>` : ""}</h3><div class="meta">${day(start)}${day(end) !== day(start) ? " → " + day(end) : ""} · ${lines.length} message${lines.length > 1 ? "s" : ""} · #${i} · ${g.points.toLocaleString()} chunks in this room${tp ? ` · topic ${tp.id}: ${esc(tp.label)}` : ""}</div>
      <div class="nav"><button class="btn" data-go="${prev}" ${prev < 0 ? "disabled" : ""}>‹ earlier</button><button class="btn" data-go="${next}" ${next < 0 ? "disabled" : ""}>later ›</button></div>
      <div class="story-btns">${tp ? `<button class="btn" data-story="topic:${tp.id}">📖 story of topic ${tp.id}</button>` : ""}<button class="btn" data-story="room:${grp[i]}">📖 story of this room</button></div>
      ${lines.map(([ms, who, text, bot]) => `<p class="msg${who === meta.owner ? " own" : ""}"><time>${hm(ms)}</time><b>${esc(who)}${bot ? " 🤖" : ""}</b> ${esc(text)}</p>`).join("")}
      ${storyBlock}${hitsBlock}`;
    panel.classList.add("open");
  } else if (storyBlock || hitsBlock) {
    panel.innerHTML = storyBlock + hitsBlock; panel.classList.add("open");
    if (!storyIds && hits[0]) flyTo(hits[0].i); else if (storyIds) flyTo(storyIds[0]);
  } else {
    panel.classList.remove("open"); panel.innerHTML = ""; if (tDay === null) flyHome();   // a time-travel day keeps the camera
  }
  const ls = linksFor(layout), pct = (x) => `${Math.round((100 * x) / Math.max(1, ls.total))}%`;
  $("status").textContent = status || (layout === "rooms"
    ? `separate · ${sepInfo.islands.length} rooms, each its own map · ${(pairs.length / 2).toLocaleString()} links inside rooms · ${ls.cross.toLocaleString()} cross-room links (${pct(ls.cross)}) shown in Combined`
    : `built ${meta.built.slice(0, 16)} · ${(pairs.length / 2).toLocaleString()} links shown (${longDropped.toLocaleString()} long hidden) · ${pct(ls.cross)} of links join two rooms`);
}

// ---- every click is a navigation
document.querySelector(".modes").onclick = (e) => { const b = e.target.closest("button"); if (b && b.dataset.m !== S.mode) go({ mode: b.dataset.m }); };
$("panel").onclick = (e) => {
  const b = e.target.closest("[data-go]"); if (b) { if (+b.dataset.go >= 0) go({ p: +b.dataset.go }); return; }
  const sb = e.target.closest("[data-story]"); if (sb) { go({ story: sb.dataset.story }); return; }
  const a = e.target.closest("a[data-i]"); if (a) { e.preventDefault(); go({ p: +a.dataset.i }); }
};
$("q").onkeydown = (e) => { const q = e.target.value.trim(); if (e.key === "Enter" && q) go({ q, p: -1, story: "" }); };
$("home").onclick = (e) => { e.preventDefault(); go({ mode: DEFAULT_MODE, layout: "all", q: "", story: "", p: -1, t: "" }); };
$("layoutSeg")?.addEventListener("click", (e) => { const b = e.target.closest("button[data-layout]"); if (b && b.dataset.layout !== (S.layout || "all")) go({ layout: b.dataset.layout }); });
$("reset").onclick = () => go({ q: "", story: "", p: -1, t: "" });
// auto-rotate button shows its state: pause icon while spinning, play icon when stopped (it no longer looks like reset)
const PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>', PLAY = '<path d="M7 5v14l11-7z"/>';
function syncSpin() { const b = $("spin"), on_ = controls.autoRotate; b.classList.toggle("on", on_); $("spinIcon").innerHTML = on_ ? PAUSE : PLAY; b.title = on_ ? "หมุนอัตโนมัติ: กำลังหมุน (กดเพื่อหยุด)" : "หมุนอัตโนมัติ: หยุดอยู่ (กดเพื่อหมุน)"; }
$("spin").onclick = () => { controls.autoRotate = !controls.autoRotate; syncSpin(); };
controls.addEventListener("change", () => { if ($("spin").classList.contains("on") !== controls.autoRotate) syncSpin(); });
// the panel starts under the bar, whatever the bar's real height is
const placePanel = () => document.documentElement.style.setProperty("--top", `${Math.ceil(document.querySelector(".bar").getBoundingClientRect().bottom) + 10}px`);
new ResizeObserver(placePanel).observe(document.querySelector(".bar")); addEventListener("resize", placePanel); placePanel();

// ---- time machine column (right edge): one tick per day with chunks, placed by date (gaps show as space), length by
// how many chunks that day; month labels on the left of the ticks; hover magnifies one day, click travels to it
const track = $("tmTrack"), ticks = $("tmTicks"), selEl = $("tmSel"); let tmHover = null, tmMouse = null, scrub = false;
function tmY(d, H) { const a = DAYS[0], b = DAYS[DAYS.length - 1]; return b === a ? H / 2 : 8 + ((d - a) / (b - a)) * (H - 16); }
function drawTimeline() {
  const H = track.clientHeight; if (!H || !DAYS.length) return;
  const mx = Math.log(1 + Math.max(...dayCount.values()));
  let html = "", lastLabelY = -99, prevMonth = "";
  DAYS.forEach((d) => {
    const y = tmY(d, H), lab = dayLabel(d);
    // dock-style magnifier: ticks within ~40 px of the mouse grow, the one under it most
    const mag = tmMouse === null ? 1 : 1 + 1.4 * Math.exp(-(((y - tmMouse) / 26) ** 2));
    const w = (6 + 16 * Math.log(1 + dayCount.get(d)) / mx) * mag;
    const cls = d === tDay ? "sel" : d === tmHover ? "hov" : tDay !== null && d < tDay ? "past" : "";
    html += `<i class="${cls}" style="top:${y}px;width:${w}px${mag > 1.05 ? `;height:${mag > 2 ? 2 : 1}px` : ""}"></i>`;
    if (y - lastLabelY > 16 && lab.slice(0, 7) !== prevMonth && Math.abs(y - (tmMouse ?? -99)) > 14) { html += `<b style="top:${y}px">${lab.slice(0, 7)}</b>`; lastLabelY = y; }
    prevMonth = lab.slice(0, 7);
  });
  if (tmHover !== null && tmHover !== tDay) html += `<b class="hov" style="top:${tmY(tmHover, H)}px">${dayLabel(tmHover)} · ${dayCount.get(tmHover)}</b>`;
  ticks.innerHTML = html;
  // the red marker is one element that slides (CSS transition, ease-in-out-expo like the points) instead of being redrawn
  placeMarker();
  const k = tDay === null ? DAYS.length : DAYS.indexOf(tDay);
  $("tmUp").disabled = k <= 0; $("tmDown").disabled = tDay === null;
  $("tmNow").classList.toggle("off", tDay !== null);
}
// the red marker follows the moving cutoff (fractional day), so it travels with the map instead of jumping
function placeMarker() {
  const H = track.clientHeight; if (!H || !DAYS.length) return;
  const dayF = Math.min(DAYS[DAYS.length - 1], Math.max(DAYS[0], (tCut + 7 * 3600) / 86400 - 1));
  selEl.classList.toggle("on", tw > 0.02);
  selEl.style.top = `${tmY(dayF, H)}px`; selEl.firstChild.textContent = dayLabel(Math.round(dayF));
}
const nearestDay = (y) => { const H = track.clientHeight; let best = DAYS[0], bd = 1e9; for (const d of DAYS) { const e = Math.abs(tmY(d, H) - y); if (e < bd) { bd = e; best = d; } } return best; };
const yIn = (e) => e.clientY - track.getBoundingClientRect().top;
// press anywhere on the column = travel to the nearest day; keep the button down and drag to scrub through days
// (one history entry per scrub: the first day pushes, the rest replace)
track.addEventListener("pointerdown", (e) => { scrub = true; track.classList.add("drag"); track.setPointerCapture(e.pointerId); const d = nearestDay(yIn(e)); if (dayLabel(d) !== S.t) go({ t: dayLabel(d), p: -1 }); });
track.addEventListener("pointermove", (e) => {
  tmMouse = yIn(e); const d = nearestDay(tmMouse);
  if (scrub && dayLabel(d) !== S.t) go({ t: dayLabel(d), p: -1 }, true);
  tmHover = d; drawTimeline();
});
const endScrub = () => { scrub = false; track.classList.remove("drag"); };
track.addEventListener("pointerup", endScrub); track.addEventListener("pointercancel", endScrub);
track.addEventListener("pointerleave", () => { if (!scrub) { tmHover = tmMouse = null; drawTimeline(); } });
const stepDay = (dir) => { const k = tDay === null ? DAYS.length : DAYS.indexOf(tDay), j = k + dir; if (j < 0) return; go({ t: j < DAYS.length ? dayLabel(DAYS[j]) : "", p: -1 }); };
// ▲ / ▼: a click steps one day; hold the button and it keeps stepping (after 350 ms, a day every 420 ms) — a replay
// of the map growing (▼) or shrinking (▲). The first step pushes history, the repeats replace it.
const stepDayHold = (dir, replace) => { const k = tDay === null ? DAYS.length : DAYS.indexOf(tDay), j = k + dir;
  if (j < 0 || (dir > 0 && tDay === null)) return false; go({ t: j < DAYS.length ? dayLabel(DAYS[j]) : "", p: -1 }, replace); return j < DAYS.length; };
for (const [id, dir] of [["tmUp", -1], ["tmDown", 1]]) {
  const b = $(id); let timer = null;
  const stop = () => { clearTimeout(timer); clearInterval(timer); timer = null; b.classList.remove("held"); };
  b.addEventListener("pointerdown", (e) => {
    if (b.disabled) return; e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add("held");
    stepDayHold(dir, false);
    timer = setTimeout(() => { timer = setInterval(() => { if (!stepDayHold(dir, true)) stop(); }, 420); }, 350);
  });
  b.addEventListener("pointerup", stop); b.addEventListener("pointercancel", stop);
  b.addEventListener("click", (e) => { if (e.detail === 0) stepDayHold(dir, false); });   // keyboard Enter/Space on the button
}
$("tmNow").onclick = () => { if (S.t) go({ t: "", p: -1 }); };
// keys: ↑ earlier day, ↓ later day (↓ past the last day = Now), Esc = Now — not while typing in the search box
addEventListener("keydown", (e) => {
  if (e.target.closest?.("input,textarea")) return;
  if (e.key === "ArrowUp") { e.preventDefault(); stepDay(-1); }
  else if (e.key === "ArrowDown" && tDay !== null) { e.preventDefault(); stepDay(1); }
  else if (e.key === "Escape" && S.t) go({ t: "", p: -1 });
});
new ResizeObserver(drawTimeline).observe(track);

// ---- hover + click
const ray = new THREE.Raycaster(); ray.params.Points.threshold = N > 20000 ? 0.7 : 1.2;
const mouse = new THREE.Vector2(); let hover = -1, down = null;
addEventListener("pointermove", (e) => {
  if (e.target !== renderer.domElement) { $("tip").style.display = "none"; hover = -1; renderer.domElement.classList.remove("on-point"); return; }
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(pts).find((h) => visible(h.index));
  hover = hit ? hit.index : -1;
  renderer.domElement.classList.toggle("on-point", hover >= 0);   // a point is clickable: hand cursor
  const t = $("tip");
  if (hover >= 0) { t.style.display = "block"; t.style.left = e.clientX + 12 + "px"; t.style.top = e.clientY + 12 + "px"; t.textContent = `${roomTitle(grp[hover])} · ${dayLabel(dayIdx[hover])}${insight && topic[hover] !== 65535 ? ` · topic ${topic[hover]}: ${insight.topics[topic[hover]].label}` : ""}`; }
  else t.style.display = "none";
});
// ---- rotate around the point under the mouse: the pivot is the point hit at pointerdown (or, on empty space, the spot
// on the plane through the current target); camera and target turn rigidly around it, so it stays under the cursor
let drag = null;
const pivotAt = (x, y) => {
  mouse.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(pts).find((h) => visible(h.index));
  if (hit) return new THREE.Vector3(xyz[hit.index * 3], xyz[hit.index * 3 + 1], xyz[hit.index * 3 + 2]);
  const n = camera.getWorldDirection(new THREE.Vector3());
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, controls.target);
  return ray.ray.intersectPlane(plane, new THREE.Vector3()) || controls.target.clone();
};
renderer.domElement.addEventListener("pointerdown", (e) => {
  down = [e.clientX, e.clientY];
  if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;   // right/modified drag = OrbitControls pan
  drag = { x: e.clientX, y: e.clientY, pivot: pivotAt(e.clientX, e.clientY) };
  controls.autoRotate = false; syncSpin();
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  const speed = (2 * Math.PI) / renderer.domElement.clientHeight;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -dx * speed)
    .multiply(new THREE.Quaternion().setFromAxisAngle(right, -dy * speed));
  const P = drag.pivot;
  camera.position.sub(P).applyQuaternion(q).add(P);
  controls.target.sub(P).applyQuaternion(q).add(P);
  camera.quaternion.premultiply(q);
});
const endDrag = (e) => { if (drag) { drag = null; try { renderer.domElement.releasePointerCapture(e.pointerId); } catch {} } };
renderer.domElement.addEventListener("pointercancel", endDrag);
// a click on a point keeps a running story or search (its panel lists stay), otherwise it opens the point alone
renderer.domElement.addEventListener("pointerup", (e) => { endDrag(e); if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 4 && hover >= 0) go({ p: hover }); down = null; });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

setMode(S.mode);
history.replaceState(S, "", location.href);
await render(S);
window.__brain = { N, links: pairs.length / 2, longDropped, rooms: groups.length, servers: servers.length, state: () => S, project: (i) => { const v = new THREE.Vector3(xyz[i * 3], xyz[i * 3 + 1], xyz[i * 3 + 2]).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; }, hover: () => hover, story: () => storyLine ? storyLine.geometry.attributes.position.count : 0,
  layout: () => ({ name: layout, gliding: !!glide, layouts: Object.keys(LAYOUTS), links: pairs.length / 2, labels: islEls.filter((o) => o.el.style.display === "block").length }),
  at: (i) => [xyz[i * 3], xyz[i * 3 + 1], xyz[i * 3 + 2]],
  bolts: () => ({ live: bolts.length, struck: struckTotal }),
  // strike the links made between two cutoffs (unix s), as a forward sweep does frame by frame (for tests)
  spark: (c0, c1) => { sparkBetween(c0, c1, performance.now()); return struckTotal; },
  tm: () => { let shown = 0; for (let i = 0; i < N; i++) if (inTime(i)) shown++; return { t: S.t, days: DAYS.length, first: dayLabel(DAYS[0]), last: dayLabel(DAYS[DAYS.length - 1]), shown, ticks: ticks.querySelectorAll("i").length, animating: !!kAnim || !!tAnim }; } };
renderer.setAnimationLoop((now) => { stepGlide(now); stepPaint(now); stepBolts(now); controls.update(); placeIslands(); renderer.render(scene, camera); });
</script>
</body>
