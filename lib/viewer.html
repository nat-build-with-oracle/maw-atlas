<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>atlas view</title>
<style>
  :root {
    --bg: #313338; --side: #2b2d31; --rail: #1e1f22; --hover: #35373c; --sel: #404249;
    --text: #dbdee1; --muted: #949ba4; --head: #f2f3f5; --link: #00a8fc; --accent: #5865f2;
    --code: #2b2d31; --border: #1f2023;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.375 "gg sans", "Noto Sans", "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  #app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  #side { background: var(--side); display: flex; flex-direction: column; min-height: 0; }
  #guild { padding: 12px 16px; font-weight: 600; color: var(--head); border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  #guild small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  #tree { overflow-y: auto; padding: 8px 8px 24px; flex: 1; }
  .cat { margin: 16px 0 4px; padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .02em;
    text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; }
  .cat:hover { color: var(--text); }
  .cat::before { content: "⌄ "; } .cat.closed::before { content: "› "; }
  .ch { display: flex; align-items: center; gap: 6px; padding: 5px 8px; margin: 1px 0; border-radius: 4px;
    color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch:hover { background: var(--hover); color: var(--text); }
  .ch.sel { background: var(--sel); color: var(--head); }
  .ch.empty { opacity: .5; }
  .ch .ico { width: 18px; text-align: center; flex: none; opacity: .8; }
  .ch .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .ch .cnt { font-size: 11px; color: var(--muted); flex: none; }
  .ch .tog { flex: none; font-size: 11px; padding: 0 4px; border-radius: 3px; }
  .ch .tog:hover { background: var(--rail); }
  .th { padding-left: 30px; font-size: 14px; }
  .th .ico { width: 12px; }
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #top { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 48px; flex: none;
    border-bottom: 1px solid var(--border); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  #title { font-weight: 600; color: var(--head); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title .sub { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  #q { background: var(--rail); border: 0; color: var(--text); border-radius: 4px; padding: 6px 8px; width: 240px; font: inherit; font-size: 14px; }
  #body { display: flex; flex: 1; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0 24px; }
  #results { width: 380px; flex: none; overflow-y: auto; background: var(--side); border-left: 1px solid var(--border); display: none; }
  #results.open { display: block; }
  #results h3 { margin: 0; padding: 12px 16px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  #results h3 button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
  .hit { margin: 0 8px 8px; padding: 8px 10px; background: var(--bg); border-radius: 6px; cursor: pointer; font-size: 14px; }
  .hit:hover { background: var(--hover); }
  .hit .where { font-size: 12px; color: var(--muted); }
  .hit mark { background: #f0b232; color: #000; border-radius: 2px; }
  .more { display: block; margin: 8px auto; background: var(--side); color: var(--text); border: 0; border-radius: 4px;
    padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px; }
  .more:hover { background: var(--sel); }
  .msg { display: grid; grid-template-columns: 56px 1fr; padding: 2px 48px 2px 16px; position: relative; }
  .msg:hover { background: rgba(2,2,2,.06); }
  .msg.first { margin-top: 17px; }
  .msg.flash { background: rgba(250,168,26,.1); box-shadow: inset 2px 0 0 #f0b232; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600;
    color: #fff; font-size: 16px; margin-top: 2px; }
  .gut { color: var(--muted); font-size: 11px; text-align: center; visibility: hidden; padding-top: 4px; }
  .msg:hover .gut { visibility: visible; }
  .hdr { display: flex; align-items: baseline; gap: 8px; }
  .who { font-weight: 500; color: var(--head); }
  .bot { background: var(--accent); color: #fff; font-size: 10px; font-weight: 600; padding: 0 4px; border-radius: 3px; line-height: 15px; }
  .when { font-size: 12px; color: var(--muted); }
  .txt { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .txt code { background: var(--code); padding: 1px 4px; border-radius: 3px; font-size: 85%; font-family: ui-monospace, Menlo, monospace; }
  .txt pre { background: var(--code); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin: 4px 0;
    overflow-x: auto; white-space: pre; font-family: ui-monospace, Menlo, monospace; font-size: 13px; max-width: 100%; }
  .txt blockquote { margin: 0; padding-left: 12px; border-left: 4px solid #4e5058; }
  .txt h1, .txt h2, .txt h3 { margin: 6px 0 2px; color: var(--head); line-height: 1.25; }
  .txt h1 { font-size: 22px; } .txt h2 { font-size: 19px; } .txt h3 { font-size: 16px; }
  .ment { background: rgba(88,101,242,.3); color: #c9cdfb; border-radius: 3px; padding: 0 2px; cursor: default; }
  a.ment { cursor: pointer; }
  .edited { font-size: 10px; color: var(--muted); }
  .sys { color: var(--muted); font-size: 14px; padding: 4px 48px 4px 72px; }
  .sys b { color: var(--text); font-weight: 500; }
  .reply { font-size: 13px; color: var(--muted); margin: 0 0 2px 0; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .reply::before { content: "╭ "; color: #4e5058; }
  .reply b { color: var(--text); font-weight: 500; }
  .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .atts img, .atts video { max-width: min(520px, 100%); max-height: 360px; border-radius: 6px; display: block; background: var(--side); cursor: zoom-in; }
  .file { display: flex; gap: 10px; align-items: center; background: var(--side); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; max-width: 432px; }
  .file .fi { font-size: 28px; }
  .file .fs { font-size: 12px; color: var(--muted); }
  .file.gone { opacity: .6; }
  .embed { border-left: 4px solid #1e1f22; background: var(--side); border-radius: 4px; padding: 8px 12px; margin-top: 4px; max-width: 520px; font-size: 14px; }
  .embed .et { font-weight: 600; color: var(--head); }
  .embed .ep { font-size: 12px; color: var(--muted); }
  .embed .ef { margin-top: 4px; } .embed .ef b { display: block; font-size: 13px; color: var(--head); }
  .rx { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .rx span { background: var(--side); border: 1px solid var(--border); border-radius: 8px; padding: 0 6px; font-size: 13px; }
  .threadlink { font-size: 13px; margin-top: 4px; display: inline-block; background: var(--side); padding: 4px 8px; border-radius: 4px; }
  .day { display: flex; align-items: center; margin: 24px 16px 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .day::before, .day::after { content: ""; flex: 1; height: 1px; background: #3f4147; }
  .day span { padding: 0 8px; }
  #empty { color: var(--muted); padding: 48px; text-align: center; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; place-items: center; z-index: 9; cursor: zoom-out; }
  #zoom.open { display: grid; }
  #zoom img { max-width: 94vw; max-height: 90vh; }
  #zoom a { position: fixed; bottom: 16px; color: #fff; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <nav id="side"><div id="guild">…</div><div id="tree"></div></nav>
  <main id="main">
    <div id="top"><div id="title"></div><input id="q" type="search" placeholder="Search" autocomplete="off"></div>
    <div id="body"><div id="log"><div id="empty">Pick a channel.</div></div><aside id="results"></aside></div>
  </main>
</div>
<div id="zoom"><img alt=""><a target="_blank" rel="noopener">open original</a></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = p => fetch(p).then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(new Error(j.error || r.status))));

let channels = [], byId = new Map(), users = new Map(), server = null;
let cur = null;               // { kind: "channel"|"thread", id }
let first = null, last = null, hasOlder = false, hasNewer = false, loading = false;
const openCats = new Set(), openThreads = new Set(), closedCats = new Set();

const PALETTE = ["#5865f2", "#3ba55c", "#faa61a", "#ed4245", "#eb459e", "#1abc9c", "#9b59b6", "#e67e22", "#3498db", "#747f8d"];
const colorFor = id => PALETTE[Number(BigInt(id || "0") % 10n)];
const initials = name => [...String(name).trim()].slice(0, 1).join("").toUpperCase() || "?";
const isVoice = c => c.type === 2 || c.type === 13;
const icon = c => c.kind === "thread" ? "↳" : c.type === 2 || c.type === 13 ? "🔊" : c.type === 15 ? "💬" : c.type === 5 ? "📢" : c.type === 16 ? "🖼" : "#";
const fmtSize = b => b == null ? "" : b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(1) + " MB";
const dt = ts => new Date(ts);
const fmtTime = ts => dt(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const fmtFull = ts => dt(ts).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
const fmtDay = ts => dt(ts).toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" });

// ── sidebar ──
function buildTree() {
  const kids = new Map();
  for (const c of channels) {
    const k = c.parent_id || "";
    if (!kids.has(k)) kids.set(k, []);
    kids.get(k).push(c);
  }
  const order = (a, b) => (isVoice(a) - isVoice(b)) || (a.position ?? 0) - (b.position ?? 0) || a.name.localeCompare(b.name);
  const threadsOf = id => (kids.get(id) || []).filter(c => c.kind === "thread").sort((a, b) => (BigInt(b.id) > BigInt(a.id) ? 1 : -1));
  const html = [];
  const chRow = c => {
    const ths = threadsOf(c.id);
    const sel = cur && cur.id === c.id ? " sel" : "";
    const empty = !c.messages && !ths.length ? " empty" : "";
    const open = openThreads.has(c.id);
    html.push(`<div class="ch${sel}${empty}" data-k="channel" data-id="${c.id}" title="${esc(c.name)}"><span class="ico">${icon(c)}</span><span class="nm">${esc(c.name)}</span>` +
      (c.messages ? `<span class="cnt">${c.messages}</span>` : "") +
      (ths.length ? `<span class="tog" data-tog="${c.id}" title="${ths.length} thread(s)">${open ? "▾" : "▸"}${ths.length}</span>` : "") + `</div>`);
    if (open) for (const t of ths) {
      html.push(`<div class="ch th${cur && cur.id === t.id ? " sel" : ""}" data-k="thread" data-id="${t.id}" title="${esc(t.name)}"><span class="ico">${icon(t)}</span><span class="nm">${esc(t.name)}</span><span class="cnt">${t.messages ?? 0}</span></div>`);
    }
  };
  for (const c of (kids.get("") || []).filter(c => c.kind === "channel").sort(order)) chRow(c);
  for (const cat of (kids.get("") || []).filter(c => c.kind === "category").sort(order)) {
    const closed = closedCats.has(cat.id);
    html.push(`<div class="cat${closed ? " closed" : ""}" data-cat="${cat.id}">${esc(cat.name)}</div>`);
    if (!closed) for (const c of (kids.get(cat.id) || []).filter(c => c.kind === "channel").sort(order)) chRow(c);
  }
  // channels whose parent category is not in the table
  const orphans = channels.filter(c => c.kind === "channel" && c.parent_id && !byId.has(c.parent_id));
  if (orphans.length) { html.push(`<div class="cat">other</div>`); orphans.sort(order).forEach(chRow); }
  $("#tree").innerHTML = html.join("");
}

$("#tree").addEventListener("click", e => {
  const tog = e.target.closest("[data-tog]");
  if (tog) { const id = tog.dataset.tog; openThreads.has(id) ? openThreads.delete(id) : openThreads.add(id); buildTree(); return; }
  const cat = e.target.closest("[data-cat]");
  if (cat) { const id = cat.dataset.cat; closedCats.has(id) ? closedCats.delete(id) : closedCats.add(id); buildTree(); return; }
  const ch = e.target.closest("[data-id]");
  if (ch) location.hash = `#/${ch.dataset.k === "thread" ? "t" : "c"}/${ch.dataset.id}`;
});

// ── message markdown (Discord's subset, escaped first) ──
function inline(s) {
  // Links and mentions become placeholders first, so ** _ ~~ inside a URL are never read as formatting.
  const keep = [];
  const stash = h => `\u0000${keep.push(h) - 1}\u0000`;
  const link = (u, text) => stash(`<a href="${u}" target="_blank" rel="noopener noreferrer">`) + text + stash("</a>");
  s = s.replace(/&lt;@!?(\d+)&gt;/g, (_, id) => stash(`<span class="ment">@${esc(users.get(id)?.name || id)}</span>`))
       .replace(/&lt;@&amp;(\d+)&gt;/g, () => stash(`<span class="ment">@role</span>`))
       .replace(/&lt;#(\d+)&gt;/g, (_, id) => {
         const c = byId.get(id);
         return stash(c ? `<a class="ment" href="#/${c.kind === "thread" ? "t" : "c"}/${id}">#${esc(c.name)}</a>` : `<span class="ment">#${id}</span>`);
       })
       .replace(/&lt;a?:(\w+):\d+&gt;/g, (_, n) => stash(`:${n}:`))
       .replace(/&lt;t:(\d+)(?::\w)?&gt;/g, (_, t) => stash(`<span class="ment">${esc(fmtFull(Number(t) * 1000))}</span>`))
       .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => link(u, t))
       .replace(/(^|[\s(])(https?:\/\/[^\s<\u0000]+[^\s<\u0000.,:;"')\]])/g, (_, p, u) => p + stash(`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`))
       .replace(/\*\*\*(.+?)\*\*\*/g, "<b><i>$1</i></b>")
       .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
       .replace(/__(.+?)__/g, "<u>$1</u>")
       .replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, "$1<i>$2</i>")
       .replace(/(^|\W)_(?!\s)(.+?)_(?!\w)/g, "$1<i>$2</i>")
       .replace(/~~(.+?)~~/g, "<s>$1</s>")
       .replace(/\|\|(.+?)\|\|/g, '<span style="background:#1e1f22">$1</span>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[i]);
}
function md(src) {
  if (!src) return "";
  const parts = esc(src).split(/(```[\s\S]*?```)/g);
  return parts.map(p => {
    if (p.startsWith("```") && p.endsWith("```") && p.length >= 6) {
      return `<pre>${p.slice(3, -3).replace(/^[\w+-]*\n/, "")}</pre>`;
    }
    return p.split(/(`[^`\n]+`)/g).map(q => q.startsWith("`") && q.length > 2 && q.endsWith("`") ? `<code>${q.slice(1, -1)}</code>` : lines(q)).join("");
  }).join("");
}
function lines(s) {
  return s.split("\n").map(l => {
    let m;
    if ((m = l.match(/^(#{1,3}) (.+)$/))) return `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;
    if ((m = l.match(/^&gt; ?(.*)$/))) return `<blockquote>${inline(m[1])}</blockquote>`;
    if ((m = l.match(/^-# (.+)$/))) return `<small style="color:var(--muted)">${inline(m[1])}</small>`;
    return inline(l);
  }).join("\n").replace(/<\/(h\d|blockquote)>\n/g, "</$1>");
}

// ── messages ──
const SYS = {
  1: m => `added someone to the thread`, 2: m => `removed someone from the thread`,
  4: m => `changed the channel name: <b>${esc(m.content)}</b>`, 6: m => `pinned a message`,
  7: m => `joined the server`, 18: m => `started a thread: <b>${esc(m.content)}</b>` + (m.thread ? ` — <a href="#/t/${m.thread.id}">open</a>` : ""),
  8: m => `boosted the server`, 21: null,
};
function attHtml(a) {
  const src = `/att/${a.id}`;
  const t = a.content_type || "";
  if (a.packed && t.startsWith("image/")) {
    const dims = a.width && a.height ? ` width="${Math.min(a.width, 520)}" style="aspect-ratio:${a.width}/${a.height};height:auto"` : "";
    return `<img loading="lazy" src="${src}" alt="${esc(a.filename)}" title="${esc(a.filename)}"${dims} data-zoom="${src}">`;
  }
  if (a.packed && t.startsWith("video/")) return `<video controls preload="metadata" src="${src}"></video>`;
  if (a.packed && t.startsWith("audio/")) return `<audio controls preload="none" src="${src}"></audio>`;
  return `<div class="file${a.packed ? "" : " gone"}"><span class="fi">📄</span><div>` +
    (a.packed ? `<a href="${src}" target="_blank">${esc(a.filename)}</a>` : `<span>${esc(a.filename)}</span>`) +
    `<div class="fs">${fmtSize(a.size)}${a.packed ? "" : " · not packed"}</div></div></div>`;
}
function msgHtml(m, prev) {
  const out = [];
  if (!prev || fmtDay(prev.ts) !== fmtDay(m.ts)) out.push(`<div class="day"><span>${esc(fmtDay(m.ts))}</span></div>`);
  if (SYS[m.type] !== undefined && SYS[m.type] !== null) {
    out.push(`<div class="sys" id="m${m.id}">→ <b>${esc(m.author.name)}</b> ${SYS[m.type](m)} <span class="when">${esc(fmtFull(m.ts))}</span></div>`);
    return out.join("");
  }
  const grouped = prev && !m.reply && SYS[prev.type] === undefined && prev.author.id === m.author.id
    && fmtDay(prev.ts) === fmtDay(m.ts) && dt(m.ts) - dt(prev.ts) < 7 * 60 * 1000;
  out.push(`<div class="msg${grouped ? "" : " first"}" id="m${m.id}">`);
  if (m.reply) {
    out.push(`<div class="reply" data-jump="${m.reply.id}"><b>@${esc(m.reply.author)}</b> ${esc(m.reply.content || (m.reply.attachments ? "📎 attachment" : ""))}</div>`);
  }
  if (grouped) out.push(`<div class="gut" title="${esc(fmtFull(m.ts))}">${esc(fmtTime(m.ts))}</div><div>`);
  else out.push(`<div><div class="av" style="background:${colorFor(m.author.id)}">${esc(initials(m.author.name))}</div></div><div>` +
    `<div class="hdr"><span class="who">${esc(m.author.name)}</span>${m.author.bot ? '<span class="bot">BOT</span>' : ""}` +
    `<span class="when" title="${esc(m.ts)}">${esc(fmtFull(m.ts))}</span></div>`);
  if (m.content) out.push(`<div class="txt">${md(m.content)}${m.edited ? ' <span class="edited">(edited)</span>' : ""}</div>`);
  for (const e of m.embeds) {
    if (!e.title && !e.description && !e.fields.length) continue;
    const color = e.color != null ? `#${e.color.toString(16).padStart(6, "0")}` : "#1e1f22";
    out.push(`<div class="embed" style="border-left-color:${color}">` +
      (e.provider ? `<div class="ep">${esc(e.provider)}</div>` : "") + (e.author ? `<div class="ep">${esc(e.author)}</div>` : "") +
      (e.title ? `<div class="et">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a>` : esc(e.title)}</div>` : "") +
      (e.description ? `<div class="txt">${md(e.description)}</div>` : "") +
      e.fields.map(f => `<div class="ef"><b>${esc(f.name)}</b><div class="txt">${md(f.value)}</div></div>`).join("") +
      (e.footer ? `<div class="ep">${esc(e.footer)}</div>` : "") + `</div>`);
  }
  if (m.attachments.length) out.push(`<div class="atts">${m.attachments.map(attHtml).join("")}</div>`);
  if (m.reactions.length) out.push(`<div class="rx">${m.reactions.map(r => `<span>${esc(r.emoji)} ${r.count}</span>`).join("")}</div>`);
  if (m.thread && byId.has(m.thread.id)) out.push(`<a class="threadlink" href="#/t/${m.thread.id}">↳ ${esc(m.thread.name)} · ${byId.get(m.thread.id).messages ?? 0} messages</a>`);
  out.push(`</div></div>`);
  return out.join("");
}

let shown = [];
function render(keepScroll) {
  const log = $("#log");
  const html = [];
  if (hasOlder) html.push(`<button class="more" data-more="older">Load older messages</button>`);
  if (!shown.length) html.push(`<div id="empty">No messages here.</div>`);
  shown.forEach((m, i) => html.push(msgHtml(m, shown[i - 1])));
  if (hasNewer) html.push(`<button class="more" data-more="newer">Load newer messages</button>`);
  const anchor = keepScroll ? log.scrollHeight - log.scrollTop : null;
  log.innerHTML = html.join("");
  if (anchor != null) log.scrollTop = log.scrollHeight - anchor;
}

function qs() { return cur.kind === "thread" ? `thread=${cur.id}` : `channel=${cur.id}`; }
async function open(kind, id, around) {
  cur = { kind, id };
  const c = byId.get(id);
  if (c && kind === "thread") openThreads.add(c.parent_id);
  buildTree();
  const parent = c && c.parent_id ? byId.get(c.parent_id) : null;
  $("#title").innerHTML = c ? `${icon(c)} ${esc(c.name)}${parent ? `<span class="sub">${parent.kind === "category" ? esc(parent.name) : "in #" + esc(parent.name)}</span>` : ""}` : esc(id);
  document.title = `${c ? c.name : id} · ${server.name}`;
  const r = await api(`/api/messages?${qs()}${around ? `&around=${around}&limit=80` : ""}`);
  shown = r.messages; hasOlder = r.hasOlder; hasNewer = r.hasNewer;
  render(false);
  const log = $("#log");
  if (around) {
    const el = document.getElementById("m" + around);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); }
  } else log.scrollTop = log.scrollHeight;
}
async function more(dir) {
  if (loading) return;
  loading = true;
  try {
    if (dir === "older") {
      const r = await api(`/api/messages?${qs()}&before=${shown[0].id}`);
      shown = [...r.messages, ...shown]; hasOlder = r.hasOlder;
      render(true);
    } else {
      const r = await api(`/api/messages?${qs()}&after=${shown[shown.length - 1].id}`);
      const top = $("#log").scrollTop;
      shown = [...shown, ...r.messages]; hasNewer = r.hasNewer;
      render(false); $("#log").scrollTop = top;
    }
  } finally { loading = false; }
}
$("#log").addEventListener("click", e => {
  const b = e.target.closest("[data-more]");
  if (b) return more(b.dataset.more);
  const z = e.target.closest("[data-zoom]");
  if (z) { $("#zoom img").src = z.dataset.zoom; $("#zoom a").href = z.dataset.zoom; $("#zoom").classList.add("open"); return; }
  const j = e.target.closest("[data-jump]");
  if (j) {
    const el = document.getElementById("m" + j.dataset.jump);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1500); }
    else location.hash = `#/${cur.kind === "thread" ? "t" : "c"}/${cur.id}/${j.dataset.jump}`;
  }
});
$("#log").addEventListener("scroll", e => { if (hasOlder && e.target.scrollTop < 200) more("older"); });
$("#zoom").addEventListener("click", e => { if (e.target.tagName !== "A") $("#zoom").classList.remove("open"); });

// ── search ──
let searchTimer = null;
$("#q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 250); });
$("#q").addEventListener("keydown", e => { if (e.key === "Escape") { $("#q").value = ""; $("#results").classList.remove("open"); } });
async function search() {
  const q = $("#q").value.trim();
  const box = $("#results");
  if (!q) { box.classList.remove("open"); return; }
  const r = await api(`/api/search?q=${encodeURIComponent(q)}`);
  const hl = s => esc(s).split(esc(q)).join(`<mark>${esc(q)}</mark>`);
  box.innerHTML = `<h3><span>${r.results.length}${r.results.length === 200 ? "+" : ""} result(s) · ${esc(r.mode)}</span><button title="close">×</button></h3>` +
    r.results.map(h => {
      const where = h.thread_id ? byId.get(h.thread_id) : byId.get(h.channel_id);
      const k = h.thread_id ? "t" : "c";
      return `<div class="hit" data-go="#/${k}/${h.thread_id || h.channel_id}/${h.message_id}"><div class="where">${where ? icon(where) + " " + esc(where.name) : ""} · ${esc(fmtFull(h.ts))}</div>` +
        `<b>${esc(h.author_name || "")}</b> <span class="txt">${hl(h.content)}</span></div>`;
    }).join("");
  box.classList.add("open");
}
$("#results").addEventListener("click", e => {
  if (e.target.closest("button")) { $("#results").classList.remove("open"); return; }
  const h = e.target.closest("[data-go]");
  if (h) location.hash = h.dataset.go;
});

// ── routing ──
function route() {
  const m = location.hash.match(/^#\/([ct])\/(\d+)(?:\/(\d+))?/);
  if (m) open(m[1] === "t" ? "thread" : "channel", m[2], m[3]).catch(err => { $("#log").innerHTML = `<div id="empty">${esc(err.message)}</div>`; });
}
window.addEventListener("hashchange", route);

(async () => {
  [server, channels] = await Promise.all([api("/api/server"), api("/api/channels")]);
  for (const u of await api("/api/users")) users.set(u.id, u);
  byId = new Map(channels.map(c => [c.id, c]));
  $("#guild").innerHTML = `${esc(server.name)}<small>${server.messages} messages · ${server.attachments} attachments${server.packed ? "" : " (not packed)"}</small>`;
  document.title = server.name;
  buildTree();
  if (location.hash) route();
  else {
    const firstCh = channels.filter(c => c.kind === "channel" && c.messages).sort((a, b) => (b.messages ?? 0) - (a.messages ?? 0))[0];
    if (firstCh) location.hash = `#/c/${firstCh.id}`;
  }
})();
</script>
</body>
</html>
